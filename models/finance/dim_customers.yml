version: 2
models:
  - name: dim_customers
    columns:
      - name: customer_id
        data_type: INT64
        data_tests:
          - unique
          - not_null
      - name: email
        data_type: STRING
      - name: lifetime_revenue
        data_type: FLOAT64
        data_tests:
          - dbt_utils.expression_is_true:
              expression: ' >= 0'
      - name: acquisition_cost
        data_type: FLOAT64
        data_tests:
          - dbt_utils.expression_is_true:
              expression: ' >= 0'
      - name: created_at
        data_type: TIMESTAMP
        data_tests:
          - not_null
      - name: valid_from
        data_type: DATE
        data_tests:
          - dbt_utils.expression_is_true:
              expression: ' <= valid_to'
      - name: valid_to
        data_type: DATE
