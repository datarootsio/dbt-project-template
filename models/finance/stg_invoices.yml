version: 2
models:
  - name: stg_invoices
    config:
      elementary:
        timestamp_column: issued_at
    data_tests:
      - elementary.freshness_anomalies:
          config:
            tags: ["elementary"]
      - elementary.all_columns_anomalies:
          config:
            tags: ["elementary"]

    columns:
      - name: invoice_id
        data_type: INT64
        data_tests:
          - unique
          - not_null
      - name: invoice_number
        data_type: STRING
      - name: issued_at
        data_type: TIMESTAMP
        data_tests:
          - not_null
      - name: invoice_amount
        data_type: FLOAT64
        data_tests:
          - dbt_utils.expression_is_true:
              expression: ' >= 0'
      - name: due_date
        data_type: DATE
        data_tests:
          - not_null
