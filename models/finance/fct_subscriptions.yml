version: 2
models:
  - name: fct_subscriptions
    config:
      elementary:
        timestamp_column: subscribed_at
    data_tests:
      - elementary.freshness_anomalies:
          config:
            tags: ["elementary"]
      - elementary.all_columns_anomalies:
          config:
            tags: ["elementary"]

    columns:
      - name: customer_id
        data_type: INT64
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: monthly_fee
        data_type: FLOAT64
        data_tests:
          - dbt_utils.expression_is_true:
              expression: ' >= 0'
      - name: churn_ratio
        data_type: FLOAT64
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1
      - name: upsell_percent
        data_type: FLOAT64
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1
      - name: subscribed_at
        data_type: TIMESTAMP
        data_tests:
          - not_null
      - name: start_date
        data_type: DATE
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ' <= end_date'
      - name: end_date
        data_type: DATE
        data_tests:
          - not_null
