version: 2
models:
  - name: stg_payments
    columns:
      - name: payment_id
        data_type: INT64
        data_tests:
          - unique
          - not_null
      - name: payment_amount
        data_type: FLOAT64
        data_tests:
          - dbt_utils.expression_is_true:
              expression: ' >= 0'
      - name: status
        data_type: STRING
      - name: paid_at
        data_type: TIMESTAMP
        data_tests:
          - not_null
