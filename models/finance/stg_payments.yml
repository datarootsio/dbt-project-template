version: 2
models:
  - name: stg_payments
    config:
      elementary:
        timestamp_column: paid_at
    data_tests:
      - elementary.freshness_anomalies:
          config:
            tags: ["elementary"]
            severity: warn
      - elementary.all_columns_anomalies:
          config:
            tags: ["elementary"]

    columns:
      - name: payment_id
        data_type: INT64
        data_tests:
          - unique
          - not_null
      - name: payment_amount
        data_type: FLOAT64
        data_tests:
          - dbt_utils.expression_is_true:
              expression: ' >= 0'
      - name: status
        data_type: STRING
      - name: paid_at
        data_type: TIMESTAMP
        data_tests:
          - not_null
