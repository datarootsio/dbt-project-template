version: 2
models:
  - name: stg_payments
    description: "Staging model for payments — covers PK, amount (_amount suffix) and timestamp (_at) use cases."
    columns:
      - name: payment_id
        data_type: INT64
        description: "Primary key — expects unique + not_null."
      - name: payment_amount
        data_type: FLOAT64
        description: "Payment amount — expects expression_is_true >= 0 (_amount suffix)."
      - name: status
        data_type: STRING
      - name: paid_at
        data_type: TIMESTAMP
        description: "Payment timestamp — expects not_null (_at suffix)."
